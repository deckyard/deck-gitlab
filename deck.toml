[package]
name = "@deckyard/gitlab"
version = "0.5.0"
description = "A client for the GitLab REST and GraphQL API: projects, issues, merge requests, pipelines, releases, branches, tags and files"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# The deck talks to a GitLab instance over HTTPS, so it opens sockets. No
# `exec`: it does not run git. No `sql`.
capabilities = ["net"]
keywords = ["gitlab", "git", "issues", "merge-requests", "pipelines", "releases", "graphql", "api"]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-gitlab/main/deck.toml"
homepage = "https://github.com/deckyard/deck-gitlab"
manual = "https://deckyard.github.io/deck-gitlab/"

# Only the default binary: `jennifer-tiny` has no `net` capability.
[engines]
jennifer = ">=0.27.0"
